[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basesimlib"]


[project]
name = "multiagent-simulations"
version = "2026.5.0"

dependencies = []
requires-python = ">=3.12"
authors = [
  {name = "Christopher T Niessl", email = "cniessl_dev@proton.me"},
]
maintainers = []
description = "Package for game theoretic simulations with multiple agents."

readme = {file = "README.md", content-type = "text/markdown"}
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E.*"]
keywords = []
classifiers = [
    "Programming Language :: Python"
]


[project.urls]
Repository = "https://github.com/cniessl-HB/MultiagentSimulations"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
